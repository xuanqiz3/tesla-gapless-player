<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>无缝播放器</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root { --bg:#0b0d10; --panel:#15181d; --line:#252a31; --fg:#eef1f5; --dim:#8b95a3; --acc:#e8443a; --on:#3dd68c; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
body { display:grid; grid-template-columns: minmax(0,1fr) 460px; height:100vh; overflow:hidden; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,select { font:inherit; color:inherit; }
#browse { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
header { display:flex; align-items:center; gap:12px; padding:16px 20px 8px; flex-wrap:wrap; }
header h1 { font-size:28px; margin:0; flex:1; min-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#btn-back { font-size:28px; width:64px; height:64px; border-radius:16px; background:var(--panel); flex-shrink:0; }
#search { flex:1 1 100%; display:flex; gap:10px; }
#search input { flex:1; min-height:56px; border-radius:14px; border:1px solid var(--line); background:var(--panel); padding:0 18px; font-size:20px; outline:none; }
#search input:focus { border-color:var(--acc); }
#tabs { display:flex; gap:8px; padding:8px 20px 12px; overflow-x:auto; flex-shrink:0; }
#tabs button { flex:0 0 auto; min-height:52px; padding:0 18px; border-radius:14px; background:var(--panel); font-size:18px; white-space:nowrap; }
#tabs button.on { background:var(--fg); color:var(--bg); font-weight:700; }
#list { overflow-y:auto; padding:0 16px 24px; display:flex; flex-direction:column; gap:10px; }
.album { display:flex; gap:16px; align-items:center; padding:12px; border-radius:18px; background:var(--panel); text-align:left; min-height:100px; width:100%; }
.album img { width:76px; height:76px; border-radius:12px; object-fit:cover; background:#222; flex-shrink:0; }
.album b { display:block; font-size:22px; } .album span { color:var(--dim); font-size:18px; }
.artist-row { display:flex; align-items:center; gap:14px; min-height:80px; padding:0 20px; border-radius:16px; background:var(--panel); text-align:left; font-size:22px; width:100%; }
.artist-row span { color:var(--dim); font-size:18px; margin-left:auto; }
.track-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:stretch; background:var(--panel); border-radius:16px; padding:6px; }
.track-row.on { outline:3px solid var(--acc); }
.track-main { display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:10px; min-height:72px; padding:0 14px; border-radius:12px; text-align:left; font-size:20px; width:100%; }
.track-main i { color:var(--dim); font-style:normal; font-size:18px; }
.track-main .meta { color:var(--dim); font-size:16px; display:block; font-weight:400; }
.track-main .dur { color:var(--dim); font-size:18px; }
.track-row.on .track-main b { color:var(--acc); }
.track-acts { display:flex; gap:6px; align-items:center; padding-right:4px; }
.track-acts button { min-width:56px; min-height:56px; border-radius:12px; background:#232830; font-size:16px; padding:0 10px; color:var(--dim); }
.track-acts button.fav.on, .track-acts button.fav[aria-pressed="true"] { color:var(--acc); }
.playall { display:block; width:100%; min-height:72px; border-radius:16px; background:var(--panel); font-weight:600; color:var(--acc); font-size:22px; }
.empty { color:var(--dim); font-size:20px; padding:40px 20px; text-align:center; }
#now { display:flex; flex-direction:column; padding:20px; gap:14px; background:var(--panel); min-height:0; overflow-y:auto; }
#np-cover { width:100%; max-width:260px; aspect-ratio:1; align-self:center; border-radius:20px; object-fit:cover; background:#222; }
.np-head { display:flex; align-items:flex-start; gap:10px; }
.np-head > div { flex:1; min-width:0; }
#np-title { font-size:28px; font-weight:700; text-align:center; } #np-sub { font-size:18px; color:var(--dim); text-align:center; }
#btn-fav-np { width:56px; height:56px; border-radius:14px; background:#232830; font-size:26px; flex-shrink:0; color:var(--dim); }
#btn-fav-np.on { color:var(--acc); }
.times { display:flex; justify-content:space-between; color:var(--dim); font-size:18px; font-variant-numeric:tabular-nums; }
input[type=range] { width:100%; height:44px; accent-color:var(--acc); }
.ctrl { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; }
.ctrl button { width:72px; height:72px; border-radius:50%; background:#232830; font-size:28px; }
#btn-play { width:96px; height:96px; background:var(--acc); font-size:40px; }
.ctrl button.on { color:var(--on); box-shadow:inset 0 0 0 3px var(--on); }
.ctrl .sm { width:64px; height:64px; font-size:22px; }
.vol { display:flex; align-items:center; gap:10px; }
.vol button { width:52px; height:52px; border-radius:12px; background:#232830; font-size:22px; flex-shrink:0; }
.modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.modes button { min-height:64px; border-radius:14px; background:#232830; font-size:20px; }
.modes button.on { background:var(--fg); color:var(--bg); font-weight:700; }
.row { display:flex; align-items:center; gap:12px; font-size:18px; color:var(--dim); flex-wrap:wrap; }
.row input[type=checkbox] { width:28px; height:28px; accent-color:var(--acc); }
.tools { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tools button, #btn-cache { min-height:56px; border-radius:14px; background:#232830; font-size:18px; }
#btn-cache { width:100%; }
.panel { border:1px solid var(--line); border-radius:16px; padding:12px; background:#101318; display:none; }
.panel.show { display:block; }
.panel h3 { margin:0 0 10px; font-size:18px; display:flex; align-items:center; gap:8px; }
.panel h3 .spacer { flex:1; }
.panel .qitem { display:flex; align-items:center; gap:8px; min-height:52px; padding:6px 10px; border-radius:10px; width:100%; text-align:left; font-size:16px; }
.panel .qitem.on { background:#232830; color:var(--acc); }
.panel .qitem span { color:var(--dim); margin-left:auto; font-size:14px; }
.sleep-opts { display:flex; flex-wrap:wrap; gap:8px; }
.sleep-opts button { min-height:48px; padding:0 14px; border-radius:12px; background:#232830; font-size:16px; }
.sleep-opts button.on { background:var(--fg); color:var(--bg); font-weight:700; }
#status { color:var(--acc); min-height:22px; font-size:18px; text-align:center; }
@media (max-width: 900px) {
  body { grid-template-columns:1fr; grid-template-rows:1fr auto; }
  #np-cover { display:none; }
  #now { max-height:48vh; padding:14px; gap:10px; }
  .ctrl button { width:60px; height:60px; font-size:24px; }
  #btn-play { width:80px; height:80px; font-size:34px; }
  .ctrl .sm { width:52px; height:52px; font-size:18px; }
  .track-acts button { min-width:48px; min-height:48px; font-size:14px; }
}
</style>
</head>
<body>
<section id="browse">
  <header>
    <button id="btn-back" aria-label="返回" hidden>‹</button>
    <h1 id="view-title">专辑</h1>
    <div id="search"><input id="q" type="search" placeholder="搜索曲名 / 艺人 / 专辑" enterkeyhint="search" autocomplete="off"></div>
  </header>
  <nav id="tabs" aria-label="浏览分类">
    <button data-tab="albums" class="on">专辑</button>
    <button data-tab="songs">全部歌曲</button>
    <button data-tab="artists">艺人</button>
    <button data-tab="favorites">收藏</button>
    <button data-tab="recent">最近播放</button>
  </nav>
  <div id="list"></div>
</section>
<section id="now">
  <img id="np-cover" alt="">
  <div class="np-head">
    <div><div id="np-title">未在播放</div><div id="np-sub"></div></div>
    <button id="btn-fav-np" aria-label="收藏" title="收藏">♡</button>
  </div>
  <div><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="进度">
    <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div></div>
  <div class="ctrl">
    <button id="btn-shuffle" class="sm" aria-label="随机播放" title="随机">🔀</button>
    <button id="btn-prev" aria-label="上一首">⏮</button>
    <button id="btn-play" aria-label="播放">▶</button>
    <button id="btn-next" aria-label="下一首">⏭</button>
    <button id="btn-repeat" class="sm" aria-label="循环" title="循环">🔁</button>
  </div>
  <div class="vol">
    <button id="btn-mute" aria-label="静音">🔊</button>
    <input id="vol" type="range" min="0" max="100" step="1" value="100" aria-label="音量">
    <b id="vol-val" style="min-width:3.5em;text-align:right;color:var(--fg);font-size:18px">100%</b>
  </div>
  <div class="modes"><button id="mode-gapless">无缝衔接</button><button id="mode-xf">交叉淡入淡出</button></div>
  <div><div class="row">淡入淡出时长 <b id="xf-val" style="margin-left:auto;color:var(--fg)">6 秒</b></div>
    <input id="xf" type="range" min="0" max="12" step="1" value="6" aria-label="交叉淡入时长"></div>
  <div class="row">同一专辑的连续曲目始终无缝，不做淡入淡出</div>
  <div class="tools">
    <button id="btn-queue-panel">播放队列</button>
    <button id="btn-sleep">睡眠定时</button>
  </div>
  <div id="queue-panel" class="panel" aria-label="播放队列">
    <h3>播放队列 <span class="spacer"></span>
      <button id="btn-q-from-cur" style="min-height:40px;padding:0 12px;border-radius:10px;background:#232830;font-size:14px">从当前开始</button>
      <button id="btn-q-clear" style="min-height:40px;padding:0 12px;border-radius:10px;background:#232830;font-size:14px">清空</button>
    </h3>
    <div id="queue-list"></div>
  </div>
  <div id="sleep-panel" class="panel" aria-label="睡眠定时">
    <h3>睡眠定时 <span class="spacer"></span><span id="sleep-left" style="font-weight:400;color:var(--dim);font-size:14px"></span></h3>
    <div class="sleep-opts">
      <button data-sleep="0">关闭</button>
      <button data-sleep="15">15 分</button>
      <button data-sleep="30">30 分</button>
      <button data-sleep="45">45 分</button>
      <button data-sleep="60">60 分</button>
    </div>
  </div>
  <label class="row"><input id="me" type="checkbox"> 经媒体元素输出（方向盘 / 系统媒体控制，需实测）</label>
  <button id="btn-cache">离线缓存全部歌曲</button>
  <div id="status"></div>
  <audio id="sink" hidden></audio>
</section>
<script type="module" src="app.js"></script>
</body>
</html>
